<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Suite - Dama, Backgammon, Sudoku</title>
    <!-- Tailwind CSS per un design moderno e responsive -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4">

    <!-- Header -->
    <header class="w-full max-w-md flex justify-between items-center py-4">
        <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-pink-500 bg-clip-text text-transparent">Game Suite Online</h1>
        <div id="auth-status" class="text-xs text-slate-400 flex items-center gap-2">
            <span id="user-display">Connessione...</span>
            <button id="google-login-btn" onclick="loginWithGoogle()" class="hidden bg-white text-slate-900 px-2.5 py-1 rounded font-medium hover:bg-slate-200 transition text-xs">Accedi Google</button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-md flex-1 flex flex-col justify-center">
        
        <!-- Schermata Iniziale / Lobby -->
        <div id="lobby-screen" class="bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 space-y-4">
            <h2 class="text-lg font-semibold text-center mb-2">Benvenuto! Scegli il gioco</h2>
            
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Il tuo Nickname</label>
                <input type="text" id="nickname-input" placeholder="Es. Giocatore1" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-indigo-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Seleziona Gioco</label>
                <select id="game-select" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-indigo-500">
                    <option value="checkers">Dama</option>
                    <option value="backgammon">Backgammon</option>
                    <option value="sudoku">Sudoku</option>
                </select>
            </div>

            <div class="pt-2 space-y-2">
                <button onclick="createRoom()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-lg transition shadow-lg shadow-indigo-600/30">Crea Nuova Stanza</button>
                <div class="flex gap-2">
                    <input type="text" id="room-code-input" placeholder="Codice Stanza" class="w-1/2 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white uppercase text-center font-mono">
                    <button onclick="joinRoom()" class="w-1/2 bg-slate-700 hover:bg-slate-600 text-white font-semibold py-2.5 rounded-lg transition">Unisciti</button>
                </div>
            </div>
            <div id="lobby-error" class="text-rose-400 text-xs text-center mt-2"></div>
        </div>

        <!-- Schermata di Gioco -->
        <div id="game-screen" class="hidden flex flex-col h-full space-y-4">
            <div class="flex justify-between items-center bg-slate-800 p-3 rounded-xl border border-slate-700">
                <div>
                    <span id="current-game-title" class="font-bold text-indigo-400 text-sm">Gioco</span>
                    <div class="text-xs text-slate-400">Stanza: <span id="room-code-display" class="font-mono text-white">----</span></div>
                </div>
                <button onclick="leaveRoom()" class="bg-rose-600/20 text-rose-400 border border-rose-600/30 px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-rose-600 hover:text-white transition">Esci</button>
            </div>

            <!-- Area Tavolo da Gioco -->
            <div id="game-board-container" class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col items-center justify-center min-h-[300px]">
                <p class="text-slate-400 text-sm animate-pulse">In attesa dell'avversario...</p>
            </div>

            <!-- Chat / Info Box -->
            <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 flex flex-col h-32">
                <div id="chat-messages" class="flex-1 overflow-y-auto space-y-1 text-xs pr-2">
                    <div class="text-slate-500 italic">Stanza creata. Condividi il codice con un amico!</div>
                </div>
                <div class="flex gap-2 mt-2 pt-2 border-t border-slate-700">
                    <input type="text" id="chat-input" placeholder="Scrivi un messaggio..." class="flex-1 px-3 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-xs text-white focus:outline-none focus:border-indigo-500" onkeydown="if(event.key==='Enter') sendChatMessage()">
                    <button onclick="sendChatMessage()" class="bg-indigo-600 px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-indigo-500 transition">Invia</button>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full max-w-md text-center text-xs text-slate-500 py-2">
        Game Suite Multiplayer &bull; Powered by Firebase
    </footer>

    <!-- Firebase Configuration & Logica App -->
    <script>
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyD8-oItLBZAWfK_xXh4KTvhkTkj5kTTKJs",
  authDomain: "game-suite-90de2.firebaseapp.com",
  databaseURL: "https://game-suite-90de2-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "game-suite-90de2",
  storageBucket: "game-suite-90de2.firebasestorage.app",
  messagingSenderId: "738175961503",
  appId: "1:738175961503:web:a3e69ff17f2a319fa2d5aa",
  measurementId: "G-M5Z8Q5X065"
};

        // Inizializzazione Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.database();

        let currentUser = null;
        let currentRoomId = null;
        let roomRef = null;

        // Autenticazione Automatica Anonima all'avvio
        auth.signInAnonymously().then((userCredential) => {
            currentUser = userCredential.user;
            document.getElementById('user-display').innerText = "Connesso (Ospite)";
        }).catch((error) => {
            console.error("Errore autenticazione:", error);
            document.getElementById('lobby-error').innerText = "Errore di connessione al server di autenticazione.";
        });

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).then((result) => {
                currentUser = result.user;
                document.getElementById('user-display').innerText = currentUser.displayName || "Utente Google";
                document.getElementById('google-login-btn').classList.add('hidden');
            }).catch((error) => {
                console.error("Errore login Google:", error);
            });
        }

        // Funzioni di Gestione Stanza
        function createRoom() {
            const nickname = document.getElementById('nickname-input').value.trim();
            const gameType = document.getElementById('game-select').value;
            const errorEl = document.getElementById('lobby-error');

            if (!nickname) {
                errorEl.innerText = "Inserisci un nickname valido!";
                return;
            }
            if (!currentUser) {
                errorEl.innerText = "Autenticazione in corso, riprova tra un secondo...";
                return;
            }

            errorEl.innerText = "";
            const roomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
            const roomData = {
                game: gameType,
                host: { uid: currentUser.uid, name: nickname },
                status: "waiting",
                createdAt: Date.now()
            };

            db.ref('rooms/' + roomCode).set(roomData).then(() => {
                enterRoom(roomCode, gameType, true);
            }).catch((err) => {
                errorEl.innerText = "Errore nella creazione della stanza.";
            });
        }

        function joinRoom() {
            const nickname = document.getElementById('nickname-input').value.trim();
            const roomCode = document.getElementById('room-code-input').value.trim().toUpperCase();
            const errorEl = document.getElementById('lobby-error');

            if (!nickname) {
                errorEl.innerText = "Inserisci un nickname valido!";
                return;
            }
            if (!roomCode || roomCode.length < 6) {
                errorEl.innerText = "Inserisci un codice stanza valido!";
                return;
            }
            if (!currentUser) {
                errorEl.innerText = "Autenticazione in corso, riprova tra un secondo...";
                return;
            }

            errorEl.innerText = "";
            db.ref('rooms/' + roomCode).once('value', (snapshot) => {
                if (snapshot.exists()) {
                    const room = snapshot.val();
                    db.ref('rooms/' + roomCode + '/guest').set({ uid: currentUser.uid, name: nickname });
                    db.ref('rooms/' + roomCode + '/status').set('playing');
                    enterRoom(roomCode, room.game, false);
                } else {
                    errorEl.innerText = "Stanza non trovata o inesistente.";
                }
            });
        }

        function enterRoom(code, gameType, isHost) {
            currentRoomId = code;
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('room-code-display').innerText = code;
            document.getElementById('current-game-title').innerText = gameType.toUpperCase();

            roomRef = db.ref('rooms/' + code);
            
            // Ascolta eventi della stanza
            roomRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) return;
                if (data.status === 'playing' && data.guest) {
                    document.getElementById('game-board-container').innerHTML = `
                        <div class="text-center space-y-2">
                            <p class="text-emerald-400 font-semibold">Partita avviata con successo!</p>
                            <p class="text-xs text-slate-300">Host: ${data.host.name} vs Ospite: ${data.guest.name}</p>
                            <div class="p-4 bg-slate-900 rounded-lg border border-slate-700 text-xs">Tavolo da gioco ${data.game.toUpperCase()} attivo in tempo reale.</div>
                        </div>
                    `;
                }
            });
        }

        function leaveRoom() {
            if (currentRoomId) {
                db.ref('rooms/' + currentRoomId).remove();
            }
            currentRoomId = null;
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('lobby-screen').classList.remove('hidden');
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if (!msg || !currentRoomId) return;

            db.ref('rooms/' + currentRoomId + '/chat').push({
                sender: document.getElementById('nickname-input').value,
                text: msg,
                time: Date.now()
            });
            input.value = '';
        }
    </script>
</body>
</html>
